name: Paid Probe

# Closeout #7 / phase3-paid-probing.md
# ----------------------------------------------------------------------------
# Hits /route + /route/settle on the production deployment with a budget-capped
# probe agent. Every 4 hours; ~24 probes/day across 20 providers at $0.005 avg.
#
# The script is non-custodial: TrustBench never holds the probe wallet's funds;
# the wallet signs an EIP-3009 authorization, the merchant submits on-chain.
#
# Required GitHub Secrets (set in repo Settings → Secrets → Actions):
#   - SCRIPTS_PROBE_API_KEY    tb_live_… key for probe@trustbench.io
#   - SCRIPTS_PROBE_WALLET_PK  0x-prefixed 64-hex-char private key (probe-only EOA)
#   - TRUSTBENCH_BASE_URL      production deployment URL
#   - SUPABASE_URL             optional; used for soft monthly cap pre-check
#   - SUPABASE_SECRET_KEY      optional; service-role key for receipts query

on:
  # PAUSED 2026-05-19 — paid-probe has been 100% failed (502 on every attempt)
  # since at least 2026-05-12, ~192 silent failures logged to idempotency_keys
  # over 8 days with no alert because the workflow exits process-success even
  # when every route attempt inside the run errors. The probe was designed to
  # catch this class of production breakage end-to-end; it instead became the
  # breakage and went undetected because CI green-status was treated as
  # functional success.
  #
  # Re-enable conditions (all required):
  #   1. paid-probe.ts updated to differentiate "no working providers in
  #      registry" (warn, exit 0) from "all attempted providers failed at
  #      probe time" (error, exit non-zero) — see lessons.md 2026-05-19.
  #   2. Root cause of the 2026-05-11→2026-05-12 regression identified
  #      (git log between paywall-v0.1.0-live and the day probe started
  #      100% failing).
  #   3. capability=data has at least one verified x402-conformant provider,
  #      OR `data` is removed from SCRIPTS_PROBE_CAPABILITIES.
  #   4. A successful manual workflow_dispatch run that completes with
  #      response_status_code=200 on at least one /route call confirming
  #      the end-to-end path is healthy.
  #
  # When re-enabling, restore the schedule line below and remove this comment
  # block. workflow_dispatch is preserved so we can still trigger manually
  # during debugging without re-enabling the cron.
  #
  # schedule:
  #   - cron: '0 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip /route/settle (no money moved)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      max_providers:
        description: 'Max providers per run (default 4)'
        required: false
        default: '4'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run paid probe
        env:
          # Live config
          TRUSTBENCH_BASE_URL: ${{ secrets.TRUSTBENCH_BASE_URL }}
          SCRIPTS_PROBE_API_KEY: ${{ secrets.SCRIPTS_PROBE_API_KEY }}
          SCRIPTS_PROBE_WALLET_PK: ${{ secrets.SCRIPTS_PROBE_WALLET_PK }}
          # Soft monthly cap pre-check (optional — server enforces hard cap)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Manual-dispatch overrides (cron runs use defaults)
          SCRIPTS_PROBE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SCRIPTS_PROBE_MAX_PROVIDERS: ${{ github.event.inputs.max_providers || '4' }}
          SCRIPTS_PROBE_CAPABILITIES: 'search,inference,data'
          SCRIPTS_PROBE_AGENT_EMAIL: 'probe@trustbench.io'
        run: npm run paid-probe
