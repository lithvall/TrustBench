name: Paid Probe

# Closeout #7 / phase3-paid-probing.md
# ----------------------------------------------------------------------------
# Hits /route + /route/settle on the production deployment with a budget-capped
# probe agent. Every 4 hours; ~24 probes/day across 20 providers at $0.005 avg.
#
# The script is non-custodial: TrustBench never holds the probe wallet's funds;
# the wallet signs an EIP-3009 authorization, the merchant submits on-chain.
#
# Required GitHub Secrets (set in repo Settings → Secrets → Actions):
#   - SCRIPTS_PROBE_API_KEY    tb_live_… key for probe@trustbench.io
#   - SCRIPTS_PROBE_WALLET_PK  0x-prefixed 64-hex-char private key (probe-only EOA)
#   - TRUSTBENCH_BASE_URL      production deployment URL
#   - SUPABASE_URL             optional; used for soft monthly cap pre-check
#   - SUPABASE_SECRET_KEY      optional; service-role key for receipts query

on:
  # PAUSED 2026-05-19 — paid-probe was 100% failed (502 on every attempt)
  # since at least 2026-05-12, ~192 silent failures logged to idempotency_keys
  # over 8 days with no alert because the workflow exits process-success even
  # when every route attempt inside the run errors. The probe was designed to
  # catch this class of production breakage end-to-end; it instead became the
  # breakage and went undetected because CI green-status was treated as
  # functional success.
  #
  # Re-enable conditions:
  #   1. ✓ DONE 2026-05-20 — paid-probe.ts now differentiates registry-empty
  #      (WARN, exit 0) from all-attempts-failed (ERROR, exit 1). See the
  #      "Exit-code semantics" block at the end of main().
  #   2. ✓ DONE 2026-05-20 — root cause of the 2026-05-11→2026-05-12
  #      regression identified: Infopunks pivoted off the cognition layer
  #      2026-05-11 (memory project_infopunks_pivot_to_paysh_radar_2026_05_11),
  #      leaving the three nightly-reseeded capability=data providers dead.
  #      Probe was correctly picking 4 score-≥40 candidates per run; all 4
  #      happened to be the dead Infopunks rows because search/inference
  #      lanes had fewer candidates. The nightly reseed has been disabled
  #      in src/crawler.ts → seedKnownX402Endpoints (rows commented out;
  #      shell preserved for revival).
  #   3. ✓ DONE 2026-05-20 — `data` removed from SCRIPTS_PROBE_CAPABILITIES
  #      env below + the script default. Accept-the-gap decision: revisit
  #      when a verified-live x402 data provider lands in the registry
  #      organically. See decisions.md 2026-05-20 entry (90-day callback).
  #   4. ✗ PENDING — one successful manual workflow_dispatch run with
  #      okCount >= 1 (i.e., [probe] OK on at least one capability=search
  #      or capability=inference target) before restoring the schedule.
  #
  # To re-enable: run a workflow_dispatch with dry_run=false, confirm one
  # [probe] OK line in the logs and exit 0 (or [probe] ERROR exit 1 surfaces
  # the actual breakage, in which case fix-then-retry). Then uncomment the
  # `schedule:` block below and delete this comment.
  #
  # schedule:
  #   - cron: '0 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip /route/settle (no money moved)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      max_providers:
        description: 'Max providers per run (default 4)'
        required: false
        default: '4'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run paid probe
        env:
          # Live config
          TRUSTBENCH_BASE_URL: ${{ secrets.TRUSTBENCH_BASE_URL }}
          SCRIPTS_PROBE_API_KEY: ${{ secrets.SCRIPTS_PROBE_API_KEY }}
          SCRIPTS_PROBE_WALLET_PK: ${{ secrets.SCRIPTS_PROBE_WALLET_PK }}
          # Soft monthly cap pre-check (optional — server enforces hard cap)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Manual-dispatch overrides (cron runs use defaults)
          SCRIPTS_PROBE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SCRIPTS_PROBE_MAX_PROVIDERS: ${{ github.event.inputs.max_providers || '4' }}
          # `data` dropped 2026-05-20 — see paused-workflow comment above
          # and decisions.md "Accept capability=data lane unsupported".
          SCRIPTS_PROBE_CAPABILITIES: 'search,inference'
          SCRIPTS_PROBE_AGENT_EMAIL: 'probe@trustbench.io'
        run: npm run paid-probe
